<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        <title>Weather Report</title>
    </head>
    <body>
        <div class="container mt-4">
            <h1>Weather Report</h1>

            <form id="weatherForm" >
                <label for="city" class="form-label">Enter City:</label>
                <input type="text" id="city" name="city" class="form-control">
                <button type="submit" class="btn btn-info mt-3">Get Weather</button>
            </form>
            <hr class="mt-4 mb-3">
            <h4>Get Report Using Lattitude and Longtitude</h4>
            <form id="weatherForm2">
                <label for="lat" class="form-label">Enter Lattitude:</label>
                <input type="text" id="lat" name="lat" class="form-control">
                <label for="lon" class="form-label">Enter Longtitude:</label>
                <input type="text" id="lon" name="lon" class="form-control">
                <button type="submit2" class="btn btn-info mt-3">Get Weather</button>
            </form>

            <div id="weatherInfo" class="mt-4"></div>

        </div>
        <script src="./weather_report.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    </body>
</html>
